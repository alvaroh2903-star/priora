# Mantém a instância gratuita do Render acordada.
#
# O plano free do Render "dorme" após ~15 min SEM tráfego HTTP de entrada — e a
# 1ª requisição depois disso leva dezenas de segundos (cold start). Este job bate
# em /health de fora (GitHub Actions) a cada ~10 min: conta como tráfego de
# entrada, mantém o serviço no ar e, se ele já tiver dormido, o próprio ping o
# acorda.
#
# Observações honestas:
#  - O agendamento do GitHub pode atrasar alguns minutos sob carga; se um ping
#    atrasar além de 15 min, o serviço dorme e o ping seguinte o acorda (só uma
#    requisição fica lenta). Para intervalos mais firmes, use também um
#    UptimeRobot/cron-job.org apontando para a mesma URL.
#  - Workflows agendados são desativados após 60 dias SEM commits no repo.
#  - Manter o serviço 24/7 consome ~720 h/mês — perto do teto de 750 h/mês do
#    plano free. Com mais de um serviço free na conta, pode estourar e suspender.
#    Solução definitiva: plano Starter (sem sleep + disco persistente).
#
# Trocou de domínio? Ajuste RENDER_URL abaixo.

name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 min (horário UTC)
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RENDER_URL: https://priora-1.onrender.com
    steps:
      - name: Ping /health (tolerante a cold start)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "${RENDER_URL}/health" || echo 000)
            echo "tentativa $i → HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "serviço acordado e respondendo."
              exit 0
            fi
            sleep 20
          done
          # Não falha o workflow por causa de um cold start demorado: o próximo
          # ping agendado tenta de novo.
          echo "sem 200 após as tentativas — a instância pode estar acordando."
          exit 0
