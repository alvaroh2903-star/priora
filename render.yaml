# Deploy da Priora no Render (https://render.com) — direto do GitHub, sem instalar nada.
# Passo a passo: crie uma conta no Render, "New +" -> "Blueprint", conecte o repositório
# e selecione a branch. O Render lê este arquivo e cria o serviço. Depois preencha os
# segredos marcados como "sync: false" no painel do Render (Environment).
services:
  - type: web
    name: priora
    # Runtime Docker (ver Dockerfile): base Node + Chromium/libs instalados pelo
    # Playwright — necessário para o bot de demurrage rodar (o runtime nativo do
    # Render não traz as bibliotecas de sistema do navegador).
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true          # o Render gera um valor forte automaticamente
      - key: AZURE_TENANT_ID
        value: common
      - key: AZURE_CLIENT_ID
        sync: false                  # cole no painel do Render
      - key: AZURE_CLIENT_SECRET
        sync: false                  # cole no painel do Render
      - key: AZURE_REDIRECT_URI
        sync: false                  # https://SEU-APP.onrender.com/auth/callback
      - key: GEMINI_API_KEY
        sync: false                  # opcional (necessário para a Clara/IA) — grátis em aistudio.google.com
      - key: FEDEX_API_KEY
        sync: false                  # opcional (rastreio FedEx) — client_id
      - key: FEDEX_SECRET_KEY
        sync: false                  # opcional (rastreio FedEx) — client_secret
      - key: FEDEX_ACCOUNT
        sync: false
      - key: FEDEX_BASE_URL
        value: https://apis.fedex.com          # produção (sandbox: https://apis-sandbox.fedex.com)
      - key: DHL_API_KEY
        sync: false                  # opcional (rastreio DHL) — header DHL-API-Key
      - key: DHL_API_SECRET
        sync: false
      - key: DHL_BASE_URL
        value: https://api-eu.dhl.com
      # --- Automação de navegador (Playwright) — base do bot de demurrage ---
      - key: BROWSER_HEADLESS
        value: "true"                # false só para depuração local com tela
      - key: PROXY_SERVER
        sync: false                  # http://host:porta ou socks5://host:porta (opcional)
      - key: PROXY_USERNAME
        sync: false                  # opcional (proxy autenticado)
      - key: PROXY_PASSWORD
        sync: false                  # opcional (proxy autenticado)
      - key: WEB_UNBLOCKER_SERVER
        sync: false                  # opcional: proxy anti-bot (ex.: http://unblocker.iproyal.com:12323)
      - key: WEB_UNBLOCKER_USERNAME
        sync: false                  # opcional
      - key: WEB_UNBLOCKER_PASSWORD
        sync: false                  # opcional
      - key: DIAG_TOKEN
        sync: false                  # opcional: liga /health/scrape p/ testar raspagem sem login
      - key: ANTICAPTCHA_PROVIDER
        value: anti-captcha          # anti-captcha | 2captcha (usado nas próximas etapas)
      - key: ANTICAPTCHA_KEY
        sync: false                  # chave do serviço de captcha (cole no painel)
      # --- Supabase (multiusuário: contas Priora isoladas) ---
      - key: SUPABASE_URL
        sync: false                  # Project Settings → API → Project URL
      - key: SUPABASE_ANON_KEY
        sync: false                  # Project Settings → API → anon public key
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                  # Project Settings → API → service_role (SECRETA)
      # --- Rocket / Head Cargo (fonte dos processos IMxxxx) ---
      - key: ROCKET_BASE_URL
        value: https://myrocket.rocketlogistics.com.br
      - key: ROCKET_API_KEY
        sync: false                  # X-API-KEY (SECRETO)
      - key: ROCKET_WORKSPACE_ID
        sync: false                  # x-workspace-id
